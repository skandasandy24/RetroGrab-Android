[versions]
agp = "8.7.3"
kotlin = "2.0.21"
downloader = "0.17.4"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version = "2024.12.01" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
activity = { module = "androidx.activity:activity-compose", version = "1.10.1" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.1.3" }
work = { module = "androidx.work:work-runtime-ktx", version = "2.10.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
jsoup = { module = "org.jsoup:jsoup", version = "1.18.3" }
downloader-library = { module = "io.github.junkfood02.youtubedl-android:library", version.ref = "downloader" }
downloader-ffmpeg = { module = "io.github.junkfood02.youtubedl-android:ffmpeg", version.ref = "downloader" }
downloader-aria = { module = "io.github.junkfood02.youtubedl-android:aria2c", version.ref = "downloader" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
